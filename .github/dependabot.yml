version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The CLI ships no runtime dependencies (everything is bundled), so every
    # bump is a dev dependency: "chore(deps-dev): …" does not trigger a release.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      # @agm-stack/eslint-config-next supports ESLint 9 and TypeScript 5 only.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types follow the oldest supported Node.js (engines: >=24), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      tooling:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
