name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test the packed tarball
        run: |
          npm pack
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npx --yes "$GITHUB_WORKSPACE"/agm-stack-create-next-stack-*.tgz --help
          npx --yes "$GITHUB_WORKSPACE"/agm-stack-create-next-stack-*.tgz smoke-app --minimal --yes --no-install --no-git
          test -f smoke-app/package.json

  # Generates real projects and runs their own checks, so template drift
  # (a directive that leaves an unused import, a missing dependency) fails CI.
  e2e:
    name: E2E (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [minimal, all]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: corepack enable
      - run: npm ci
      - run: npm run build
      - run: npm run e2e -- --preset ${{ matrix.preset }}
